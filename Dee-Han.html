<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700&family=Bitter:wght@600;800&family=Caveat:wght@600;700&display=swap">
<style>
/* Layout: plank-wood header, chalkboard hero, then a market table of paper price-tag cards on linen. */
:root {
  --bg: #e3dfc6;
  --paper: #f2eedb;
  --ink: #2b2a22;
  --ink-soft: #5e5a47;
  --wood: #6b4a2f;
  --wood-dark: #4a321f;
  --wood-light: #8a6240;
  --leaf: #4d6b2c;
  --leaf-ink: #f4f1dd;
  --beet: #8c2f3d;
  --yolk: #e2a72e;
  --chalk: #26332b;
  --chalk-ink: #f1efe2;
  --line: rgba(70, 55, 30, 0.28);
  --shadow: rgba(40, 28, 10, 0.4);
  --font-display: "Bitter", Georgia, "Times New Roman", serif;
  --font-hand: "Caveat", "Segoe Script", "Comic Sans MS", cursive;
  --font-body: "Alegreya Sans", "Segoe UI", Roboto, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1a15; --paper: #26241c; --ink: #ece6d0; --ink-soft: #b0a98f;
    --wood: #3a2a1b; --wood-dark: #2a1d12; --wood-light: #5a4129;
    --leaf: #8fb15a; --leaf-ink: #15200a; --beet: #e0808d; --yolk: #e8b94a;
    --chalk: #121a15; --chalk-ink: #eee9d4; --line: rgba(235, 225, 190, 0.2); --shadow: rgba(0, 0, 0, 0.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1b1a15; --paper: #26241c; --ink: #ece6d0; --ink-soft: #b0a98f;
  --wood: #3a2a1b; --wood-dark: #2a1d12; --wood-light: #5a4129;
  --leaf: #8fb15a; --leaf-ink: #15200a; --beet: #e0808d; --yolk: #e8b94a;
  --chalk: #121a15; --chalk-ink: #eee9d4; --line: rgba(235, 225, 190, 0.2); --shadow: rgba(0, 0, 0, 0.6);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.45;
  background-image: radial-gradient(var(--line) 0.6px, transparent 0.7px);
  background-size: 7px 7px;
}
body.lock { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--yolk); outline-offset: 2px; }
.wrap {
  max-width: 1160px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* Plank header */
.planks {
  background-color: var(--wood);
  background-image:
    repeating-linear-gradient(180deg, transparent 0 38px, rgba(0,0,0,.38) 38px 40px),
    repeating-linear-gradient(90deg, rgba(255,255,255,.03) 0 3px, rgba(0,0,0,.05) 3px 7px),
    radial-gradient(ellipse 30px 12px at 18% 60%, rgba(0,0,0,.22), transparent 70%),
    radial-gradient(ellipse 26px 10px at 74% 25%, rgba(0,0,0,.2), transparent 70%);
  border-bottom: 5px solid var(--wood-dark);
  color: #f3e7cf;
}
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 12px; flex-wrap: wrap; }
.stamp {
  font-family: var(--font-display); font-weight: 800; text-transform: uppercase; letter-spacing: .14em;
  font-size: 17px; line-height: 1.1; padding: 9px 14px; border: 3px double #f3e7cf; border-radius: 3px;
  transform: rotate(-1.5deg); background: rgba(0,0,0,.18); color: #f3e7cf; margin: 0;
}
.bar-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.lang { display: inline-flex; border: 2px solid #f3e7cf; border-radius: 3px; overflow: hidden; }
.lang button { background: transparent; color: #f3e7cf; border: 0; padding: 6px 12px; font-weight: 700; letter-spacing: .06em; }
.lang button[aria-pressed="true"] { background: #f3e7cf; color: var(--wood-dark); }
.who {
  background: rgba(0,0,0,.25); border: 2px solid #f3e7cf; color: #f3e7cf; border-radius: 3px;
  padding: 6px 12px; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

/* Chalkboard hero */
.hero { padding-block: 22px 8px; }
.board {
  background: var(--chalk); color: var(--chalk-ink);
  border: 10px solid var(--wood-light); border-radius: 4px;
  box-shadow: inset 0 0 50px rgba(0,0,0,.5), 0 10px 22px -12px var(--shadow);
  padding: 22px 22px 24px;
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px 28px; align-items: end;
}
.eyebrow { font-family: var(--font-display); font-weight: 600; text-transform: uppercase; letter-spacing: .18em; font-size: 13px; color: var(--yolk); margin: 0 0 8px; }
.board h1 { font-family: var(--font-hand); font-weight: 700; font-size: clamp(34px, 6vw, 56px); line-height: 1; margin: 0 0 10px; text-wrap: balance; }
.board p.lead { margin: 0; max-width: 56ch; opacity: .92; }
.board-side { display: flex; flex-direction: column; gap: 12px; align-items: flex-start; min-width: 0; }
.stats { display: flex; gap: 18px; font-family: var(--font-hand); font-size: 24px; color: var(--yolk); flex-wrap: wrap; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center;
  background: var(--leaf); color: var(--leaf-ink); border: 2px solid var(--leaf); border-radius: 3px;
  padding: 10px 18px; font-weight: 700; font-size: 17px; letter-spacing: .02em; text-decoration: none;
  box-shadow: 0 3px 0 rgba(0,0,0,.35);
}
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.35); }
.btn.yolk { background: var(--yolk); border-color: var(--yolk); color: #2b2a22; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--ink-soft); box-shadow: none; }
.btn.small { padding: 6px 12px; font-size: 15px; }
.btn.danger { background: transparent; color: var(--beet); border-color: var(--beet); box-shadow: none; }

/* Market table: filters */
.filters { padding-block: 18px 6px; display: grid; gap: 12px; }
.frow { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
.field input[type="search"], .field select, .field input[type="text"], .field input[type="number"], .field input[type="date"], .field textarea {
  width: 100%; background: var(--paper); border: 2px solid var(--wood-light); border-radius: 3px; padding: 9px 12px; min-width: 0;
}
.field textarea { resize: vertical; min-height: 84px; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 8px; scrollbar-width: thin; }
.chip {
  flex: none; background: var(--paper); border: 2px solid var(--wood-light); border-radius: 3px; padding: 6px 13px;
  font-weight: 500; white-space: nowrap;
}
.chip[aria-pressed="true"] { background: var(--leaf); border-color: var(--leaf); color: var(--leaf-ink); font-weight: 700; }
.note {
  background: var(--paper); border: 2px dashed var(--wood-light); border-radius: 3px; padding: 10px 14px; margin: 6px 0 0; color: var(--ink-soft);
}
.count { font-family: var(--font-hand); font-size: 24px; color: var(--ink-soft); margin: 8px 0 0; }

/* Price-tag cards */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(255px, 1fr)); gap: 26px 22px; padding-block: 18px 36px; }
.tag {
  position: relative; background: var(--paper); border-radius: 3px; min-width: 0;
  box-shadow: 0 1px 0 var(--line), 0 10px 18px -12px var(--shadow);
  display: flex; flex-direction: column;
}
.tag::after { content: ""; position: absolute; inset: 6px; border: 1.5px dashed var(--line); border-radius: 2px; pointer-events: none; }
.photo { position: relative; aspect-ratio: 4 / 3; margin: 10px 10px 0; background: var(--bg); overflow: hidden; border-radius: 2px; }
.photo img, .photo .art, .photo .art svg { width: 100%; height: 100%; display: block; }
.photo img { object-fit: cover; }
.art svg { padding: 10px; }
.price {
  position: absolute; left: -4px; bottom: 10px; z-index: 2; background: var(--chalk); color: var(--chalk-ink);
  font-family: var(--font-hand); font-weight: 700; font-size: 25px; line-height: 1; padding: 7px 12px 7px 24px; transform: rotate(-2deg);
  border-radius: 2px 6px 6px 2px; box-shadow: 0 3px 8px -2px var(--shadow); max-width: 92%;
}
.price::before { content: ""; position: absolute; left: 8px; top: 50%; width: 8px; height: 8px; margin-top: -4px; border-radius: 50%; background: var(--paper); box-shadow: inset 0 1px 2px rgba(0,0,0,.5); }
.price small { font-family: var(--font-body); font-size: 14px; font-weight: 500; opacity: .85; }
.price.neg { font-size: 20px; }
.badge {
  position: absolute; right: 8px; top: 8px; z-index: 2; font-family: var(--font-display); font-weight: 800; text-transform: uppercase;
  letter-spacing: .1em; font-size: 11px; padding: 4px 8px; color: var(--beet); background: var(--paper); border: 2px solid var(--beet);
  border-radius: 2px; transform: rotate(3deg);
}
.badge.ex { color: var(--ink-soft); border-color: var(--ink-soft); }
.soldmark {
  position: absolute; inset: 0; z-index: 3; display: grid; place-items: center; background: rgba(20,15,5,.45);
  font-family: var(--font-display); font-weight: 800; text-transform: uppercase; letter-spacing: .2em; color: #fff; font-size: 26px;
}
.soldmark span { border: 4px solid #fff; padding: 4px 14px; transform: rotate(-8deg); }
.tbody { padding: 14px 18px 18px; display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 0; }
.tbody h3 { font-family: var(--font-display); font-weight: 800; font-size: 19px; line-height: 1.2; margin: 0; overflow-wrap: anywhere; }
.meta { display: flex; flex-wrap: wrap; gap: 2px 14px; color: var(--ink-soft); font-size: 15.5px; }
.meta b { color: var(--ink); font-weight: 700; }
.desc { margin: 0; font-size: 15.5px; overflow-wrap: anywhere; }
.seller { font-size: 15px; color: var(--ink-soft); border-top: 1.5px dashed var(--line); padding-top: 8px; margin-top: auto; overflow-wrap: anywhere; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; position: relative; z-index: 4; }
.actions .btn { flex: 1 1 auto; }
.empty { grid-column: 1 / -1; text-align: center; padding: 34px 16px; border: 2px dashed var(--wood-light); border-radius: 3px; background: var(--paper); }
.empty h3 { font-family: var(--font-hand); font-size: 32px; margin: 0 0 4px; }
.empty p { margin: 0; color: var(--ink-soft); }
footer { background: var(--wood-dark); color: #e8dcc2; padding-block: 18px; border-top: 5px solid var(--wood); font-size: 15px; }
footer p { margin: 0; max-width: 70ch; }

/* Modal */
.overlay {
  position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: rgba(20, 14, 4, .62);
  padding: calc(16px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.panel {
  position: relative; width: 100%; max-width: 520px; max-height: 100%; overflow-y: auto; background: var(--paper);
  border: 4px solid var(--wood-light); border-radius: 4px; padding: 20px 20px 22px; box-shadow: 0 20px 40px -10px rgba(0,0,0,.6);
}
.panel h2 { font-family: var(--font-display); font-weight: 800; font-size: 22px; margin: 0 38px 6px 0; line-height: 1.2; }
.panel p.sub { margin: 0 0 14px; color: var(--ink-soft); }
.xbtn { position: absolute; right: 10px; top: 10px; width: 36px; height: 36px; border: 2px solid var(--ink-soft); background: transparent; border-radius: 3px; font-size: 20px; line-height: 1; }
.form { display: grid; gap: 12px; }
.field label { display: block; font-weight: 700; margin-bottom: 4px; font-size: 15.5px; }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
.drop {
  display: grid; place-items: center; min-height: 120px; border: 2px dashed var(--wood-light); border-radius: 3px; cursor: pointer;
  text-align: center; padding: 8px; color: var(--ink-soft); background: var(--bg); overflow: hidden;
}
.drop img { max-height: 190px; max-width: 100%; display: block; }
.drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.drop:focus-within { outline: 3px solid var(--yolk); outline-offset: 2px; }
.check { display: flex; gap: 10px; align-items: flex-start; font-weight: 500; }
.check input { width: 22px; height: 22px; margin-top: 2px; accent-color: var(--leaf); flex: none; }
.err { color: var(--beet); font-weight: 700; min-height: 1.2em; margin: 0; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row .btn { flex: 1 1 auto; }
.phone { font-family: var(--font-display); font-weight: 800; font-size: 24px; user-select: all; -webkit-user-select: all; overflow-wrap: anywhere; margin: 4px 0 10px; }
.kv { margin: 0 0 10px; color: var(--ink-soft); }
.kv b { color: var(--ink); }


/* Sign-in, inbox and chat */
button.who { font: inherit; cursor: pointer; }
.dot {
  display: inline-block; min-width: 20px; padding: 0 6px; border-radius: 10px; background: var(--beet); color: var(--paper);
  border: 1.5px solid #f3e7cf; font-weight: 700; font-size: 14px; line-height: 18px; text-align: center; font-style: normal;
}
.dot.sm { min-width: 0; width: 11px; height: 11px; padding: 0; border: 0; border-radius: 50%; flex: none; }
.panel.wide { max-width: 900px; }
.cblock { border-top: 1.5px dashed var(--line); padding-top: 12px; margin-top: 12px; }
.cblock .kv { margin-bottom: 4px; }
.phone.sm { font-size: 20px; }
.chatwrap {
  display: grid; grid-template-columns: 260px minmax(0, 1fr); height: min(540px, 68vh); min-width: 0;
  border: 2px solid var(--wood-light); background: var(--bg); margin-top: 10px;
}
.clist { overflow-y: auto; border-right: 2px solid var(--wood-light); display: flex; flex-direction: column; min-width: 0; }
.citem { display: block; width: 100%; text-align: left; background: transparent; border: 0; border-bottom: 1.5px dashed var(--line); padding: 10px 12px; min-width: 0; }
.citem.on { background: var(--paper); }
.citem b { display: flex; gap: 6px; align-items: center; min-width: 0; }
.citem b span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.citem .l2, .citem .l3 { display: block; font-size: 14.5px; color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.thread { display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; background: var(--paper); }
.thead { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-bottom: 2px solid var(--wood-light); min-width: 0; }
.thead .back { display: none; }
.thead > div { min-width: 0; }
.tsub { font-size: 14.5px; color: var(--ink-soft); overflow-wrap: anywhere; }
.msgs { flex: 1; min-height: 0; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.msg { display: flex; flex-direction: column; max-width: 82%; gap: 2px; min-width: 0; }
.msg.me { align-self: flex-end; align-items: flex-end; }
.msg.them { align-self: flex-start; align-items: flex-start; }
.bub { padding: 8px 12px; border-radius: 3px; white-space: pre-wrap; overflow-wrap: anywhere; }
.me .bub { background: var(--leaf); color: var(--leaf-ink); }
.them .bub { background: var(--bg); border: 1.5px solid var(--line); }
.mt { font-size: 13px; color: var(--ink-soft); }
.composer { display: flex; gap: 8px; padding: 10px 12px; border-top: 2px solid var(--wood-light); align-items: flex-end; }
.composer textarea { flex: 1; min-width: 0; background: var(--bg); border: 2px solid var(--wood-light); border-radius: 3px; padding: 8px 10px; resize: none; }
.chatnote { margin: 0; padding: 0 12px 6px; font-size: 14px; color: var(--ink-soft); }
.thread .err { padding: 0 12px; min-height: 0; }
.chatnone { padding: 16px; color: var(--ink-soft); margin: 0; }
@media (max-width: 720px) {
  .chatwrap { grid-template-columns: minmax(0, 1fr); }
  .chatwrap .thread { display: none; }
  .chatwrap.show-thread .thread { display: flex; }
  .chatwrap.show-thread .clist { display: none; }
  .thead .back { display: inline-flex; }
}

@media (max-width: 720px) {
  .board { grid-template-columns: 1fr; padding: 18px 16px 20px; }
  .frow { grid-template-columns: 1fr 1fr; }
  .frow .field:first-child { grid-column: 1 / -1; }
  .grid { grid-template-columns: 1fr; }
  .two { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<header class="planks">
  <div class="wrap bar">
    <h2 class="stamp" id="brand" data-i="brand">Онлайн урожай</h2>
    <div class="bar-right">
      <button type="button" class="who" id="loginBtn" data-act="login" hidden></button>
      <button type="button" class="who" id="inbox" data-act="inbox" hidden></button>
      <span class="who" id="who" hidden></span>
      <div class="lang" role="group" aria-label="Язык / Тіл">
        <button type="button" data-act="lang-ru" id="lang-ru" aria-pressed="true">РУС</button>
        <button type="button" data-act="lang-kk" id="lang-kk" aria-pressed="false">ҚАЗ</button>
      </div>
    </div>
  </div>
</header>

<main>
  <section class="hero wrap" aria-labelledby="h1">
    <div class="board">
      <div>
        <p class="eyebrow" data-i="eyebrow"></p>
        <h1 id="h1" data-i="heroTitle"></h1>
        <p class="lead" data-i="heroText"></p>
      </div>
      <div class="board-side">
        <div class="stats" id="stats"></div>
        <button type="button" class="btn yolk" id="mainCta" data-act="cta"></button>
      </div>
    </div>
  </section>

  <section class="wrap filters" aria-label="Фильтры">
    <div class="frow">
      <div class="field"><input type="search" id="q" data-ph="searchPh" autocomplete="off" aria-label="Поиск"></div>
      <div class="field"><select id="regionSel" aria-label="Регион"></select></div>
      <div class="field"><select id="sortSel" aria-label="Сортировка"></select></div>

    <div class="chips" id="chips" role="group" aria-label="Категории"></div>
    <div id="notice"></div>

  </section>

  <section class="wrap">
    <div class="grid" id="grid"></div>
  </section>
</main>

<footer><div class="wrap"><p data-i="footer"></p></div></footer>
<div class="overlay" id="modal" hidden></div>

            var c = document.createElement("canvas");
            c.width = Math.max(1, Math.round(img.width * r)); c.height = Math.max(1, Math.round(img.height * r));
            c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
            out = c.toDataURL("image/jpeg", q);
            if (out.length < 90000) break;
            q = Math.max(0.5, q - 0.08); side = Math.round(side * 0.85);
          }
          URL.revokeObjectURL(url);
          out.length < 180000 ? resolve(out) : reject(new Error("big"));
        } catch (e) { reject(e); }
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error("img")); };
      img.src = url;
    });
  }
  function onPhoto(e) {
    var f = e.target.files && e.target.files[0];
    if (!f) return;
    shrinkImage(f).then(function (data) {
      pendingPhoto = data;
      $("f_drop").innerHTML = '<img src="' + data + '" alt=""><input type="file" id="f_photo" accept="image/*">';
      $("f_photo").addEventListener("change", onPhoto);
      $("f_err").textContent = "";
    }).catch(function () { $("f_err").textContent = t("photoErr"); });
  }
  async function saveListing(old) {
    var err = $("f_err");
    var title = $("f_title").value.trim(), region = $("f_region").value, qty = parseFloat($("f_qty").value), price = parseFloat($("f_price").value);
    if (title.length < 2) { err.textContent = t("eName"); $("f_title").focus(); return; }
    if (!region) { err.textContent = t("eRegion"); $("f_region").focus(); return; }
    if (!(qty > 0)) { err.textContent = t("eQty"); $("f_qty").focus(); return; }
    if (!$("f_own").checked) { err.textContent = t("eOwn"); $("f_own").focus(); return; }
    var ref = old ? db.doc("listings/" + old.id) : db.collection("listings").doc();
    var data = {
      sellerId: uid, title: title, category: $("f_cat").value, price: price > 0 ? price : 0, unit: $("f_unit").value, qty: qty,
      region: region, harvest: $("f_harvest").value || "", desc: $("f_desc").value.trim(), own: true, status: old ? (old.status || "active") : "active",
      photo: pendingPhoto || (old && old.photo) || "", createdAt: old ? old.createdAt : Date.now(), updatedAt: Date.now()
    };
    $("f_save").disabled = true;
    try { await ref.set(data); closeModal(); } catch (e) {
      err.textContent = (e && e.code === "invalid_argument") ? t("noWrite") : (e && e.code === "quota_exceeded" ? t("saveErr") : t("saveErr"));
      $("f_save").disabled = false;
    }
  }

  function contactModal(l) {
    var body;
    if (l.example) body = '<p class="sub">' + esc(t("cExample")) + "</p>";
    else {
      var s = sellers[l.sellerId];
      var canChat = !!s && s.chatOn !== false;
      if (!s || (!s.phone && !s.telegram && !canChat)) body = '<p class="sub">' + esc(t("cNone")) + "</p>";
      else {
        body = '<p class="kv">' + esc(t("cProduct")) + ": <b>" + esc(l.title) + "</b><br>" + esc(t("seller")) + ": <b>" + esc(s.name) + "</b>" +
          (l.region ? "<br>" + esc(regionLabel(l.region)) : "") + "</p>";
        if (canChat) body += '<div class="row"><button type="button" class="btn" data-act="chat" data-id="' + esc(l.id) + '">' + esc(t("cChat")) + "</button></div>";
        if (s.telegram) body += '<div class="cblock"><div class="kv">' + esc(t("cTgLabel")) + '</div><div class="phone sm">@' + esc(s.telegram) + '</div>' +
          '<div class="row"><a class="btn yolk" href="https://t.me/' + esc(s.telegram) + '" target="_blank" rel="noopener">' + esc(t("cTg")) + "</a></div></div>";
        if (s.phone) body += '<div class="cblock"><div class="kv">' + esc(t("cPhone")) + '</div><div class="phone" id="c_phone">' + esc(fmtPhone(s.phone)) + "</div>" +
          '<div class="row"><button type="button" class="btn ghost" data-act="copy" data-v="' + esc(fmtPhone(s.phone)) + '" id="c_copy">' + esc(t("cCopy")) + "</button>" +
          '<a class="btn" href="tel:+' + esc(s.phone) + '">' + esc(t("cCall")) + "</a></div>" +
          '<div class="row" style="margin-top:10px"><a class="btn yolk" href="https://wa.me/' + esc(s.phone) + '" target="_blank" rel="noopener">' + esc(t("cWa")) + "</a></div></div>";
        body += '<p class="kv" style="margin-top:14px">' + esc(t("cNote")) + "</p>";
      }
    }
    openModal('<h2 id="mtitle">' + esc(t("cTitle")) + "</h2>" + body);
  }

  /* ---------- Chat ---------- */
  function chatPartner(c) { return c.sellerId === uid ? c.buyerId : c.sellerId; }
  function partnerName(c) { var p = sellers[chatPartner(c)]; return (p && p.name) || t("seller"); }
  function fmtTime(ts) {
    if (!ts) return "";
    var d = new Date(ts), loc = lang === "kk" ? "kk-KZ" : "ru-RU";
    try {
      var tm = d.toLocaleTimeString(loc, { hour: "2-digit", minute: "2-digit" });
      if (d.toDateString() === new Date().toDateString()) return tm;
      return d.toLocaleDateString(loc, { day: "numeric", month: "short" }) + ", " + tm;
    } catch (e) { return ""; }
  }
  function markSeen(id) {
    var c = chats[id];
    if (!c || !db || !uid) return;
    if (!((c.lastAt || 0) > ((c.seen && c.seen[uid]) || 0))) return;
    var p = {}; p["seen." + uid] = Date.now();
    db.doc("chats/" + id).update(p).catch(function () {});
  }
  function chatLeave() {
    if (chatState.unsub) { chatState.unsub(); chatState.unsub = null; }
    if (chatState.id) { var id = chatState.id; chatState.id = null; chatState.meta = null; chatState.msgs = []; markSeen(id); }
  }
  function openChatModal() {
    openModal('<h2 id="mtitle">' + esc(t("chatTitle")) + '</h2><div class="chatwrap" id="chatwrap"><div class="clist" id="clist"></div><div class="thread" id="thread"><p class="chatnone">' + esc(t("chatPick")) + "</p></div></div>", "wide");
    renderChatList();
  }
  function renderChatList() {
    var el = $("clist");
    if (!el) return;
    var arr = Object.keys(chats).map(function (k) { return chats[k]; });
    if (chatState.id && !chats[chatState.id] && chatState.meta) arr.push(Object.assign({ id: chatState.id, lastAt: Date.now(), lastText: "" }, chatState.meta));
    arr.sort(function (a, b) { return (b.lastAt || 0) - (a.lastAt || 0); });
    el.innerHTML = arr.length ? arr.map(function (c) {
      return '<button type="button" class="citem' + (c.id === chatState.id ? " on" : "") + '" data-act="chat-open" data-id="' + esc(c.id) + '"><b>' +
        (isUnread(c) ? '<i class="dot sm" aria-hidden="true"></i>' : "") + "<span>" + esc(partnerName(c)) + '</span></b><span class="l2">' + esc(c.listingTitle || "") + '</span><span class="l3">' + esc(c.lastText || "") + "</span></button>";
    }).join("") : '<p class="chatnone">' + esc(t("chatEmpty")) + "</p>";
  }
  function selectChat(cid, meta) {
    if (chatState.unsub) { chatState.unsub(); chatState.unsub = null; }
    if (chatState.id && chatState.id !== cid) markSeen(chatState.id);
    chatState.id = cid; chatState.meta = meta; chatState.msgs = [];
    var c = meta || {};
    $("thread").innerHTML = '<div class="thead"><button type="button" class="btn small ghost back" data-act="chat-back" aria-label="' + esc(t("chatBack")) + '">←</button><div><b>' + esc(partnerName(c)) +
      '</b><div class="tsub">' + esc(t("chatAbout")) + " " + esc(c.listingTitle || "") + '</div></div></div>' +
      '<div class="msgs" id="msgs" role="log" aria-live="polite"></div>' +
      '<form class="composer" id="composer"><textarea id="c_text" rows="2" maxlength="1000" aria-label="' + esc(t("chatPh")) + '" placeholder="' + esc(t("chatPh")) + '"></textarea><button type="submit" class="btn" id="c_send">' + esc(t("chatSend")) + "</button></form>" +
      '<p class="chatnote">' + esc(t("chatNote")) + '</p><p class="err" id="c_err" role="alert"></p>';
    $("chatwrap").classList.add("show-thread");
    $("composer").addEventListener("submit", function (e) { e.preventDefault(); sendMsg(); });
    $("c_text").addEventListener("keydown", function (e) { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendMsg(); } });
    renderMsgs(true);
    renderChatList();
    chatState.unsub = db.collection("chats/" + cid + "/messages").orderBy("at", "desc").limit(150).onSnapshot(function (snap) {
      if (chatState.id !== cid) return;
      chatState.msgs = snap.docs.map(function (d) { var x = d.data() || {}; x.id = d.id; return x; }).reverse();
      renderMsgs(false);
    }, function () { var e = $("c_err"); if (e) e.textContent = t("saveErr"); });
    markSeen(cid);
    try { $("c_text").focus({ preventScroll: true }); } catch (e) {}
  }
  function renderMsgs(first) {
    var el = $("msgs");
    if (!el) return;
    var nearEnd = first || el.scrollHeight - el.scrollTop - el.clientHeight < 80;
    el.innerHTML = chatState.msgs.length ? chatState.msgs.map(function (m) {
      return '<div class="msg ' + (m.from === uid ? "me" : "them") + '"><div class="bub">' + esc(m.text) + '</div><span class="mt">' + esc(fmtTime(m.at)) + "</span></div>";
    }).join("") : '<p class="chatnone">' + esc(t("chatNone")) + "</p>";
    if (nearEnd) el.scrollTop = el.scrollHeight;
  }
  async function sendMsg() {
    var ta = $("c_text");
    if (!ta || !chatState.id) return;
    var text = ta.value.trim();
    if (!text) return;
    var cid = chatState.id, m = chatState.meta || {}, err = $("c_err"), btn = $("c_send"), now = Date.now();
    btn.disabled = true; err.textContent = "";
    try {
      var ref = db.doc("chats/" + cid), snap = await ref.get();
      var base = { lastText: text.slice(0, 120), lastAt: now, lastFrom: uid };
      if (snap.exists) { var up = Object.assign({}, base); up["seen." + uid] = now; await ref.update(up); }
      else { var sn = {}; sn[uid] = now; await ref.set(Object.assign({ listingId: m.listingId || "", listingTitle: m.listingTitle || "", sellerId: m.sellerId, buyerId: m.buyerId, participants: [m.sellerId, m.buyerId], createdAt: now, seen: sn }, base)); }
      await db.collection("chats/" + cid + "/messages").add({ from: uid, text: text, at: now });
      if (chatState.id === cid) ta.value = "";
    } catch (e) {
      if (chatState.id === cid) err.textContent = (e && e.code === "invalid_argument") ? t("noWrite") : t("chatSendErr");
    }
    if (chatState.id === cid) { btn.disabled = false; ta.focus(); }
  }
  function startChat(listingId) {
    var l = byId(listingId);
    if (!l) return;
    if (!uid || !db) { gateModal(); return; }
    if (canWrite === false) { infoModal(t("noWrite")); return; }
    if (!mySeller()) { F.after = function () { startChat(listingId); }; profileModal(); return; }
    if (l.sellerId === uid) return;
    openChatModal();
    selectChat(l.id + "-" + uid, { listingId: l.id, listingTitle: l.title, sellerId: l.sellerId, buyerId: uid });
  }

  function copyPhone(btn) {
    var txt = btn.getAttribute("data-v");
    var done = function () { btn.textContent = t("cCopied"); setTimeout(function () { btn.textContent = t("cCopy"); }, 1600); };
    var fallback = function () { var el = $("c_phone"); if (el) { var r = document.createRange(); r.selectNodeContents(el); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); } };
    try { navigator.clipboard.writeText(txt).then(done, fallback); } catch (e) { fallback(); }
  }

  /* ---------- Actions ---------- */
  function onCta() {
    if (!db || !uid) { gateModal(); return; }
    if (canWrite === false) { infoModal(t("noWrite")); return; }
    if (!mySeller()) { F.afterRegister = true; profileModal(); return; }
    listingModal(null);
  }
  function byId(id) { for (var i = 0; i < listings.length; i++) if (listings[i].id === id) return listings[i]; return null; }
  async function patch(id, data) { try { await db.doc("listings/" + id).update(data); } catch (e) { infoModal(t("saveErr")); } }

  document.addEventListener("click", function (e) {
    if (e.target === modal) { closeModal(); return; }
    var el = e.target.closest("[data-act]");
    if (!el) return;
    var act = el.getAttribute("data-act"), id = el.getAttribute("data-id");
    if (act !== "del" && pendingDel) { pendingDel = null; if (act !== "delok") renderGrid(); }
    switch (act) {
      case "lang-ru": case "lang-kk":
        lang = act === "lang-kk" ? "kk" : "ru";
        try { localStorage.setItem("ur_lang", lang); } catch (x) {}
        applyLang(); renderAll(); break;
      case "cta": onCta(); break;
      case "cat": F.cat = el.getAttribute("data-v"); renderChips(); renderGrid(); break;
      case "mine": F.mine = !F.mine; renderChips(); renderGrid(); break;
      case "close": closeModal(); break;
      case "contact": var it = byId(id); if (!it) { for (var i = 0; i < DEMOS.length; i++) if (DEMOS[i].id === id) it = { example: true }; } if (it) contactModal(it); break;
      case "copy": copyPhone(el); break;
      case "login": gateModal(); break;
      case "google": googleLogin(); break;
      case "logout": if (auth) { closeModal(); auth.signOut(); } break;
      case "inbox": if (!uid || !db) gateModal(); else openChatModal(); break;
      case "chat": startChat(id); break;
      case "chat-open": if (chats[id]) selectChat(id, chats[id]); break;
      case "chat-back": var cw = $("chatwrap"); if (cw) cw.classList.remove("show-thread"); break;
      case "edit": var o = byId(id); if (o) listingModal(o); break;
      case "sold": patch(id, { status: "sold" }); break;
      case "reopen": patch(id, { status: "active" }); break;
      case "del": pendingDel = id; renderGrid(); break;
      case "delok": pendingDel = null; db.doc("listings/" + id).delete().catch(function () { infoModal(t("saveErr")); }); break;
    }
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !modal.hidden) closeModal(); });
  $("q").addEventListener("input", function (e) { F.q = e.target.value; renderGrid(); });
  $("regionSel").addEventListener("change", function (e) { F.region = e.target.value; renderGrid(); });
  $("sortSel").addEventListener("change", function (e) { F.sort = e.target.value; renderGrid(); });
  /* The profile button in the header opens the profile editor. */
  $("who").style.cursor = "pointer";
  $("who").setAttribute("role", "button"); $("who").setAttribute("tabindex", "0");
  $("who").addEventListener("click", function () { if (mySeller()) profileModal(); });
  $("who").addEventListener("keydown", function (e) { if ((e.key === "Enter" || e.key === " ") && mySeller()) { e.preventDefault(); profileModal(); } });

  /* ---------- Boot ---------- */
  function boot() {
    applyLang(); renderAll();
    var cfg = window.FIREBASE_CONFIG;
    if (!window.firebase || !cfg || !cfg.apiKey || /PASTE/.test(cfg.apiKey)) { dbState = "off"; cfgMissing = true; renderAll(); gateDone = true; gateModal(); return; }
    try { firebase.initializeApp(cfg); db = firebase.firestore(); auth = firebase.auth(); } catch (e) { dbState = "error"; renderAll(); return; }
    dbState = "ok"; renderAll();
    db.collection("listings").orderBy("createdAt", "desc").limit(60).onSnapshot(function (snap) {
      listings = snap.docs.map(function (d) { var x = d.data() || {}; x.id = d.id; return x; });
      renderAll();
    }, function () { dbState = "error"; renderAll(); });
    auth.onAuthStateChanged(function (u) {
      if (sellersUnsub) { sellersUnsub(); sellersUnsub = null; }
      if (chatsUnsub) { chatsUnsub(); chatsUnsub = null; }
      if (!modal.hidden) closeModal();
      sellers = {}; chats = {}; gateDone = false; F.mine = false;
      uid = u ? u.uid : null; meName = (u && u.displayName) || ""; canWrite = !!u;
      renderAll();
      if (!u) { decideGate(); return; }
      sellersUnsub = db.collection("sellers").limit(500).onSnapshot(function (snap) {
        var m = {}; snap.docs.forEach(function (d) { m[d.id] = d.data(); }); sellers = m; renderAll();
        renderChatList();
        decideGate();
      }, function () { decideGate(); });
      chatsUnsub = db.collection("chats").where("participants", "array-contains", u.uid).limit(200).onSnapshot(function (snap) {
        var m = {}; snap.docs.forEach(function (d) { var x = d.data() || {}; x.id = d.id; m[d.id] = x; });
        chats = m; renderTop(); renderChatList();
      }, function () {});
    });
  }
  boot();
})();
</script>

</body></html>
