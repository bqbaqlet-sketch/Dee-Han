  .chatwrap.show-thread .thread { position: fixed; inset: 0; z-index: 45; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  body.in-thread .tabbar { display: none; }
  .tab { font-size: 12.5px; }
}

@media (max-width: 720px) {
  .board { grid-template-columns: 1fr; padding: 18px 16px 20px; }
  .frow { grid-template-columns: 1fr 1fr; }
  .frow .field:first-child { grid-column: 1 / -1; }
  .grid { grid-template-columns: 1fr; }
  .two { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
.tools { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 2px; }
.linkbtn { background: none; border: 0; padding: 2px 0; font-size: 15px; color: var(--ink-soft); text-decoration: underline; text-underline-offset: 3px; }
.rate { color: #b9770e; font-weight: 700; white-space: nowrap; }
.stars { color: #d79a1b; letter-spacing: 1px; }
.tag.flash { outline: 3px solid var(--yolk); outline-offset: 2px; }
.rev { padding: 8px 0; border-top: 1px solid var(--line); }
.rev:first-of-type { border-top: 0; }
.rev b { overflow-wrap: anywhere; }
.rev p { margin: 2px 0 0; overflow-wrap: anywhere; white-space: pre-wrap; }
.rtime { color: var(--ink-soft); font-size: 14px; margin-left: 6px; }
.starpick { display: flex; gap: 4px; margin: 6px 0 8px; }
.starpick button { background: none; border: 0; font-size: 32px; line-height: 1; padding: 0 2px; color: #d79a1b; }
.reasons { display: grid; gap: 8px; margin: 8px 0 12px; }
.reasons label { display: flex; gap: 10px; align-items: center; font-weight: 600; }
.reasons input { width: 20px; height: 20px; accent-color: var(--leaf); }
.sgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 12px 0; }
.sbox { background: var(--bg); border-radius: 12px; padding: 10px 6px; text-align: center; }
.sbox b { display: block; font-family: var(--font-display); font-size: 26px; line-height: 1.1; }
.sbox span { font-size: 14px; color: var(--ink-soft); }
.about h3 { font-family: var(--font-display); font-size: 17px; margin: 14px 0 4px; }
.about p { margin: 0 0 6px; }
.attach { padding: 8px 10px; min-width: 46px; }
.attach svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; display: block; }
.bub.photo { padding: 4px; }
.mimg { display: block; max-width: 100%; max-height: 260px; border-radius: 8px; cursor: zoom-in; }
.zoomimg { display: block; max-width: 100%; max-height: 78vh; margin: 8px auto 0; border-radius: 8px; }
.tray { display: flex; gap: 10px; padding: 10px 14px 2px; overflow-x: auto; background: var(--paper); }
.tray[hidden] { display: none; }
.tray div { position: relative; flex: none; }
.tray img { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; display: block; }
.tray button { position: absolute; top: -6px; right: -6px; width: 22px; height: 22px; padding: 0; border-radius: 50%; border: 0; background: var(--ink); color: var(--paper); font-size: 14px; line-height: 22px; }
.mgrid { display: grid; gap: 4px; grid-template-columns: repeat(2, minmax(0, 1fr)); min-width: 180px; }
.mgrid.n1 { grid-template-columns: minmax(0, 1fr); }
.mgrid .mimg { width: 100%; height: 130px; object-fit: cover; max-height: none; }
.mgrid.n1 .mimg { height: auto; max-height: 260px; object-fit: contain; }
.cap { padding: 6px 8px 3px; white-space: pre-wrap; overflow-wrap: anywhere; }
.seg { display: flex; flex-wrap: wrap; gap: 8px; }
.seg .chip { flex: 1 1 auto; text-align: center; font-size: 16px; padding: 10px 8px; }
.form .seg { margin-bottom: 2px; }
.dealbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--paper); }
.dealbar[hidden] { display: none; }
.dealbar .dtxt { font-weight: 700; flex: 1 1 140px; min-width: 0; }
.dealbar .row { flex: 0 1 auto; flex-wrap: nowrap; }
.dealbar .btn { flex: 0 0 auto; }
.sysmsg { align-self: center; text-align: center; font-size: 14.5px; color: var(--ink-soft); background: var(--paper); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; max-width: 92%; overflow-wrap: anywhere; }
.nicklink { background: none; border: 0; padding: 0; margin: 0; font: inherit; font-weight: 800; color: inherit; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; text-align: left; }
.seller[data-act] { cursor: pointer; }
.srow { display: flex; gap: 12px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.srow:first-of-type { border-top: 0; }
.srow .sth { width: 56px; height: 56px; border-radius: 8px; object-fit: cover; flex: none; background: var(--bg); display: grid; place-items: center; font-size: 26px; }
.srow .sinfo { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.srow .sinfo b { display: block; }
.srow .sinfo span { color: var(--ink-soft); font-size: 15px; }
.srow .btn { flex: none; }
.citem.bot { background: var(--paper); }
.citem.bot.on { outline: 2px solid var(--leaf); outline-offset: -2px; }
.faq { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 12px; border-top: 1.5px solid var(--line); max-height: 40%; overflow-y: auto; background: var(--paper); }
.faq .chip { white-space: normal; text-align: left; font-size: 15.5px; }
.faq .fqt { flex: 1 0 100%; font-weight: 700; color: var(--ink-soft); }
</style>

  function fmtTime(ts) {

  var BOTX = {"ru": {"sub": "Автоответчик, не ИИ", "list": "Автоответчик · частые вопросы", "role": "Бот", "pick": "Выберите вопрос:", "hello": "Привет! Я BeeBot 🐝, автоответчик сайта DeeHan Online. Я не искусственный интеллект: просто даю готовые ответы на частые вопросы. Выберите вопрос ниже.", "qa": [["Как опубликовать объявление?", "Нажмите «Создать» (плюс) в нижней панели. Выберите раздел «Урожай» или «Улей», добавьте фото, название, цену, количество и регион, поставьте отметку, что это ваш урожай, и нажмите «Опубликовать». Объявление сразу увидят все посетители."], ["Как связаться с продавцом?", "Откройте объявление и нажмите «Связаться»: там телефон, Telegram и кнопка для чата на сайте (если продавец включил чат). Нажмите на ник продавца, чтобы посмотреть его профиль, товары и отзывы."], ["Как проходит покупка?", "Договоритесь с продавцом в чате. Затем покупатель нажимает «Купить», продавец подтверждает кнопкой «Продать», после получения товара покупатель нажимает «Товар получен», и только после этого продавец может отметить «Продано». Оплату и доставку вы согласуете между собой."], ["Как оставить отзыв?", "Откройте объявление, нажмите «Связаться», внизу окна поставьте звёзды от 1 до 5, напишите комментарий и нажмите «Отправить отзыв». На одного продавца можно оставить один отзыв, его можно изменить."], ["Как пожаловаться на объявление?", "На карточке объявления нажмите «Пожаловаться», выберите причину и отправьте. Жалоба придёт владельцу сайта. На свои объявления пожаловаться нельзя."], ["Как сохранить объявление?", "Нажмите на сердечко на карточке: объявление попадёт во вкладку «Корзина» и останется там даже после перезахода. Нажмите на сердечко ещё раз, чтобы убрать."], ["Как отправить фото в чате?", "В чате с человеком нажмите скрепку слева от поля сообщения, выберите до 4 фото, при желании напишите подпись и отправьте."], ["Как сменить язык, тему или профиль?", "Откройте вкладку «Профиль» → «Настройки». Там можно выбрать язык (русский или казахский), тему (светлая или тёмная), изменить профиль (ник, город, аватар, контакты) и выйти из аккаунта."], ["Что такое «Улей»?", "Это раздел для мёда с вашей пасеки. Переключатель «Урожай / Улей» находится вверху главной страницы. Для мёда указывают вид, натуральность («Натуральный» или «Добавлен сахар»), вес упаковки, цвет, консистенцию и год сбора."], ["Можно ли продавать купленный товар?", "Нет. На сайте можно продавать только то, что вы вырастили или произвели сами. Перепродажа запрещена правилами. Если заметили такое объявление, нажмите «Пожаловаться»."], ["Кто видит мои контакты?", "Телефон и Telegram видят вошедшие пользователи, когда открывают ваше объявление и нажимают «Связаться». Адрес вашей почты Google другим пользователям не показывается."], ["Как удалить объявление или аккаунт?", "Объявление: Профиль → «Мои объявления» → «Удалить». Чтобы удалить аккаунт и данные, напишите в «Поддержку». Подробности есть в «Политике конфиденциальности» (Профиль → Настройки)."], ["Это бесплатно?", "Да, сейчас пользоваться сайтом и публиковать объявления можно бесплатно."], ["Как написать в поддержку?", "Профиль → Настройки → «Поддержка». Выберите тему, опишите вопрос и отправьте. Ответ придёт на вашу почту Google или в чат."]]}, "kk": {"sub": "Автожауапшы, ЖИ емес", "list": "Автожауапшы · жиі қойылатын сұрақтар", "role": "Бот", "pick": "Сұрақты таңдаңыз:", "hello": "Сәлем! Мен BeeBot 🐝, DeeHan Online сайтының автожауапшысымын. Мен жасанды интеллект емеспін: жиі қойылатын сұрақтарға дайын жауап беремін. Төменнен сұрақты таңдаңыз.", "qa": [["Хабарландыруды қалай жариялауға болады?", "Төменгі панельдегі «Қосу» (плюс) түймесін басыңыз. «Егін» немесе «Омарта» бөлімін таңдап, фото, атауы, бағасы, көлемі мен өңірін енгізіңіз, бұл өз егініңіз екеніне белгі қойып, «Жариялау» түймесін басыңыз. Хабарландыруды бірден барлық келушілер көреді."], ["Сатушымен қалай байланысуға болады?", "Хабарландыруда «Байланысу» түймесін басыңыз: онда телефон, Telegram және сайттағы чатқа арналған түйме бар (сатушы чатты қосқан болса). Сатушының профилін, тауарлары мен пікірлерін көру үшін оның лақап атын басыңыз."], ["Сатып алу қалай өтеді?", "Чатта сатушымен келісіңіз. Содан кейін сатып алушы «Сатып алу» түймесін басады, сатушы «Сату» түймесімен растайды, тауарды алғасын сатып алушы «Тауар алынды» түймесін басады, тек содан кейін сатушы «Сатылды» деп белгілей алады. Төлем мен жеткізуді өзара келісесіздер."], ["Пікірді қалай қалдыруға болады?", "Хабарландыруда «Байланысу» түймесін басып, терезенің төменгі жағында 1-ден 5-ке дейін жұлдыз қойыңыз, пікір жазып, «Пікір жіберу» түймесін басыңыз. Бір сатушыға бір пікір қалдыруға болады, оны өзгертуге болады."], ["Хабарландыруға қалай шағымдануға болады?", "Хабарландыру карточкасында «Шағымдану» түймесін басып, себебін таңдап, жіберіңіз. Шағым сайт иесіне түседі. Өз хабарландыруларыңызға шағымдануға болмайды."], ["Хабарландыруды қалай сақтауға болады?", "Карточкадағы жүрекшені басыңыз: хабарландыру «Себет» бөліміне түседі және сайтқа қайта кірсеңіз де сақталады. Алып тастау үшін жүрекшені тағы басыңыз."], ["Чатта фотоны қалай жіберуге болады?", "Адаммен чатта хабарлама жолының сол жағындағы қыстырғышты басып, 4 фотоға дейін таңдаңыз, қаласаңыз жазу қосып, жіберіңіз."], ["Тілді, тақырыпты немесе профильді қалай өзгертуге болады?", "«Профиль» → «Баптаулар» бөлімін ашыңыз. Мұнда тілді (орысша немесе қазақша), тақырыпты (ашық немесе қараңғы) таңдауға, профильді (лақап ат, қала, аватар, байланыстар) өзгертуге және аккаунттан шығуға болады."], ["«Омарта» деген не?", "Бұл өз омартаңыздағы балға арналған бөлім. «Егін / Омарта» ауыстырғышы басты беттің жоғарғы жағында. Бал үшін түрі, табиғилығы («Табиғи» немесе «Қант қосылған»), орама салмағы, түсі, консистенциясы және жиналған жылы көрсетіледі."], ["Сатып алынған тауарды сатуға бола ма?", "Жоқ. Сайтта тек өзіңіз өсірген немесе өндірген өнімді сатуға болады. Қайта сатуға ережелер бойынша тыйым салынады. Мұндай хабарландыруды байқасаңыз, «Шағымдану» түймесін басыңыз."], ["Менің байланыстарымды кім көреді?", "Телефон мен Telegram-ды сіздің хабарландыруыңызды ашып, «Байланысу» түймесін басқан кірген пайдаланушылар көреді. Google поштаңыздың мекенжайы басқа пайдаланушыларға көрсетілмейді."], ["Хабарландыруды немесе аккаунтты қалай жоюға болады?", "Хабарландыру: Профиль → «Менің хабарландыруларым» → «Жою». Аккаунт пен деректерді жою үшін «Қолдау» арқылы жазыңыз. Толығырақ «Құпиялылық саясатында» (Профиль → Баптаулар)."], ["Бұл тегін бе?", "Иә, қазір сайтты пайдалану және хабарландыру жариялау тегін."], ["Қолдау қызметіне қалай жазуға болады?", "Профиль → Баптаулар → «Қолдау». Тақырыпты таңдап, сұрағыңызды сипаттап, жіберіңіз. Жауап Google поштаңызға немесе чатқа келеді."]]}};

  BOTX.ru.qa.push(["Как установить сайт как приложение?", "Android (Chrome): Профиль → Настройки → «Установить приложение», либо меню браузера → «Установить приложение». iPhone (Safari): нажмите «Поделиться» → «На экран «Домой»». После этого иконка DeeHan появится на экране телефона."]);

        (isUnread(c) ? '<i class="dot sm" aria-hidden="true"></i>' : "") + "</span></button>";

  function subscribeMsgs(cid) {
    if (chatState.unsub) { chatState.unsub(); chatState.unsub = null; }

    if (chatState.unsub) { chatState.unsub(); chatState.unsub = null; }
    if (chatState.id && chatState.id !== cid) markSeen(chatState.id);
    chatState.id = cid; chatState.meta = meta; chatState.msgs = []; chatState.pending = []; chatState.bot = false;
    var c = meta || {};
    $("thread").innerHTML = '<div class="thead"><button type="button" class="btn small ghost back" data-act="chat-back" aria-label="' + esc(t("chatBack")) + '">←</button>' + avImg(partnerProfile(c), "md") +
      '<div><b><button type="button" class="nicklink" data-act="seller" data-id="' + esc(chatPartner(c)) + '">' + esc(partnerName(c)) + '</button> <span class="role">[' + esc(partnerRole(c)) + ']</span></b><div class="tsub">' + esc(t("chatAbout")) + " " + esc(c.listingTitle || "") + "</div></div></div>" +
      '<div class="dealbar" id="dealbar" hidden></div>' +
      '<div class="msgs" id="msgs" role="log" aria-live="polite"></div>' +
      '<div class="tray" id="tray" hidden></div><form class="composer" id="composer"><button type="button" class="btn ghost attach" id="c_attach" aria-label="' + esc(t("chatAttach")) + '"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.5l-8.6 8.6a5.5 5.5 0 0 1-7.8-7.8l9-9a3.7 3.7 0 0 1 5.2 5.2l-9 9a1.8 1.8 0 0 1-2.6-2.6l8.3-8.3"/></svg></button><input type="file" id="c_file" accept="image/*" multiple style="display:none"><textarea id="c_text" rows="2" maxlength="1000" aria-label="' + esc(t("chatPh")) + '" placeholder="' + esc(t("chatPh")) + '"></textarea><button type="submit" class="btn" id="c_send">' + esc(t("chatSend")) + "</button></form>" +
      '<p class="chatnote">' + esc(t("chatNote")) + '</p><p class="err" id="c_err" role="alert"></p>';
    $("chatwrap").classList.add("show-thread");
    document.body.classList.add("in-thread");
    $("composer").addEventListener("submit", function (e) { e.preventDefault(); sendMsg(); });
    $("c_attach").addEventListener("click", function () { $("c_file").click(); });
    $("c_file").addEventListener("change", async function (e) {
      var files = Array.prototype.slice.call(e.target.files || []); e.target.value = "";
      var er = $("c_err"); if (er) er.textContent = "";
      for (var k = 0; k < files.length; k++) {
        if (chatState.pending.length >= 4) { if (er) er.textContent = t("chatTooMany"); break; }
        try { chatState.pending.push(await shrinkImage(files[k])); } catch (x) { if (er) er.textContent = t("chatPhotoErr"); }
      }
      renderTray();
    });
    $("c_text").addEventListener("keydown", function (e) { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendMsg(); } });
    renderDeal();
    renderMsgs(true);
    renderChatList();
    if (chats[cid]) subscribeMsgs(cid);
    markSeen(cid);
    try { $("c_text").focus({ preventScroll: true }); } catch (e) {}
  }
  function dealStatus(c) { return (c && c.deal && c.deal.status) || "none"; }
  function renderDeal() {
    var el = $("dealbar"); if (!el) return;
    var c = chats[chatState.id];
    if (!c || !c.lastAt || !uid) { el.hidden = true; el.innerHTML = ""; return; }
    var buyer = uid === c.buyerId, st = dealStatus(c), l = byId(c.listingId);
    var sold = !!l && l.status === "sold", h = "", txt = "", btns = "";
    var b = function (a, k, cls) { return '<button type="button" class="btn small ' + (cls || "") + '" data-act="deal-' + a + '">' + esc(t(k)) + "</button>"; };
    if (st === "done") txt = "dFinished";
    else if (st === "none") { if (sold) txt = "dSoldAlready"; else if (buyer) btns = b("buy", "dBuy"); }
    else if (st === "requested") { txt = buyer ? "dWaitSeller" : "dAskSell"; btns = (buyer ? "" : b("sell", "dSell")) + b("cancel", "dCancel", "ghost"); }
    else if (st === "confirmed") { txt = buyer ? "dAskRecv" : "dWaitRecv"; btns = (buyer ? b("recv", "dRecv") : "") + b("cancel", "dCancel", "ghost"); }
    else if (st === "received") { txt = buyer ? "dWaitDone" : "dAskDone"; btns = buyer ? "" : b("done", "dDone"); }
    if (!txt && !btns) { el.hidden = true; el.innerHTML = ""; return; }
    el.hidden = false;
    el.innerHTML = (txt ? '<span class="dtxt">' + esc(t(txt)) + "</span>" : "") + (btns ? '<div class="row">' + btns + "</div>" : "");
  }
  async function dealStep(act, cidArg) {
    var cid = cidArg || chatState.id, c = chats[cid];
    if (!c || !uid) return;
    var now = Date.now(), buyer = uid === c.buyerId, seller = uid === c.sellerId, st = dealStatus(c), next = null;
    if (act === "buy" && buyer && st === "none") next = "requested";
    else if (act === "sell" && seller && st === "requested") next = "confirmed";
    else if (act === "recv" && buyer && st === "confirmed") next = "received";
    else if (act === "done" && seller && st === "received") next = "done";
    else if (act === "cancel" && (st === "requested" || st === "confirmed")) next = "none";
    if (!next) return;
    var key = { requested: "buy", confirmed: "sell", received: "recv", done: "done", none: "cancel" }[next];
    var err = $("c_err");
    try {
      if (next === "done") await db.doc("listings/" + c.listingId).update({ status: "sold", updatedAt: now });
      var up = { deal: { status: next, at: now, by: uid }, lastText: t("sys_" + key), lastAt: now, lastFrom: uid };
      up["seen." + uid] = now;
      await db.doc("chats/" + cid).update(up);
      await db.collection("chats/" + cid + "/messages").add({ from: uid, text: "", sys: key, at: now });
    } catch (e) { if (err) err.textContent = t("saveErr") + (e && e.code ? " [" + e.code + "]" : ""); }
  }
  function receivedDealChat(listingId) {
    var ks = Object.keys(chats).filter(function (k) { var c = chats[k]; return c.listingId === listingId && dealStatus(c) === "received"; });
    return ks.length ? ks[0] : null;
  }
  function renderMsgs(first) {
    var el = $("msgs");
    if (!el) return;
    var nearEnd = first || el.scrollHeight - el.scrollTop - el.clientHeight < 80;
    var c = chats[chatState.id] || chatState.meta || {};
    var seenByPartner = (chats[chatState.id] && chats[chatState.id].seen && chats[chatState.id].seen[chatPartner(c)]) || 0;
    el.innerHTML = chatState.msgs.length ? chatState.msgs.map(function (m) {
      if (m.sys) return '<div class="sysmsg">' + esc(t("sys_" + m.sys)) + " · " + esc(fmtTime(m.at)) + "</div>";
      var mine = m.from === uid, rd = mine && seenByPartner >= (m.at || 0);
      var tick = mine ? '<span class="tick' + (rd ? " read" : "") + '" role="img" aria-label="' + esc(t(rd ? "read" : "sent")) + '">' + (rd ? TICK2 : TICK1) + "</span>" : "";
      return '<div class="msg ' + (mine ? "me" : "them") + '">' + bubHtml(m) + '<span class="mt">' + esc(fmtTime(m.at)) + tick + "</span></div>";
    }).join("") : '<p class="chatnone">' + esc(t("chatNone")) + "</p>";
    if (nearEnd) el.scrollTop = el.scrollHeight;
  }
  function isImg(v) { return typeof v === "string" && v.indexOf("data:image/") === 0; }
  function msgImgs(m) { var l = Array.isArray(m.imgs) ? m.imgs : (m.img ? [m.img] : []); return l.filter(isImg); }
  function bubHtml(m) {
    var im = msgImgs(m);
    if (!im.length) return '<div class="bub">' + esc(m.text || "") + "</div>";
    return '<div class="bub photo"><div class="mgrid n' + (im.length === 1 ? 1 : 2) + '">' + im.map(function (x) { return '<img class="mimg" data-act="zoom" src="' + x + '" alt="' + esc(t("chatPhoto")) + '">'; }).join("") + "</div>" + (m.text ? '<div class="cap">' + esc(m.text) + "</div>" : "") + "</div>";
  }
  function renderTray() {
    var el = $("tray"); if (!el) return;
    var p = chatState.pending || [];
    el.hidden = !p.length;
    el.innerHTML = p.map(function (x, i) { return '<div><img src="' + x + '" alt=""><button type="button" data-act="unstage" data-v="' + i + '" aria-label="' + esc(t("close")) + '">×</button></div>'; }).join("");
  }
  async function sendMsg() {
    var ta = $("c_text");
    if (!ta || !chatState.id) return;
    var text = ta.value.trim(), imgs = (chatState.pending || []).slice();
    if (!text && !imgs.length) return;
    var cid = chatState.id, m = chatState.meta || {}, err = $("c_err"), btn = $("c_send"), now = Date.now();
    var total = 0; imgs.forEach(function (x) { total += x.length; });
    if (total > 760000) { err.textContent = t("chatTooBig"); return; }
    btn.disabled = true; err.textContent = "";
    try {
      var ref = db.doc("chats/" + cid), exists = !!chats[cid];
      var last = imgs.length ? "📷 " + (text ? text : t("chatPhoto")) : text;
      var base = { lastText: last.slice(0, 120), lastAt: now, lastFrom: uid };
      if (exists) { var up = Object.assign({}, base); up["seen." + uid] = now; await ref.update(up); }
      else { var sn = {}; sn[uid] = now; await ref.set(Object.assign({ listingId: m.listingId || "", listingTitle: m.listingTitle || "", sellerId: m.sellerId, buyerId: m.buyerId, participants: [m.sellerId, m.buyerId], createdAt: now, seen: sn }, base)); }
      await db.collection("chats/" + cid + "/messages").add(imgs.length ? { from: uid, text: text, imgs: imgs, at: now } : { from: uid, text: text, at: now });
      if (chatState.id === cid) { ta.value = ""; chatState.pending = []; renderTray(); if (!chatState.unsub) subscribeMsgs(cid); }
    } catch (e) {
      if (chatState.id === cid) err.textContent = t("chatSendErr") + (e && e.code ? " [" + e.code + "]" : "");
    }
    if (chatState.id === cid) { btn.disabled = false; ta.focus(); }
  }
  function startChat(listingId) {
    var l = byId(listingId);
    if (!l) return;
    if (!uid || !db) { gateModal(); return; }
    if (!mySeller()) { F.after = function () { startChat(listingId); }; profileModal(); return; }
    if (l.sellerId === uid) return;
    closeModal();
    setTab("chat");
    selectChat(l.id + "-" + uid, { listingId: l.id, listingTitle: l.title, sellerId: l.sellerId, buyerId: uid });
  }

  function copyPhone(btn) {
    var txt = btn.getAttribute("data-v");
    var done = function () { btn.textContent = t("cCopied"); setTimeout(function () { btn.textContent = t("cCopy"); }, 1600); };
    var fallback = function () { var el = $("c_phone"); if (el) { var r = document.createRange(); r.selectNodeContents(el); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); } };
    try { navigator.clipboard.writeText(txt).then(done, fallback); } catch (e) { fallback(); }
  }

  function onCta() {
    if (!db || !uid) { gateModal(); return; }
    if (canWrite === false) { infoModal(t("noWrite")); return; }
    if (!mySeller()) { F.afterRegister = true; profileModal(); return; }
    listingModal(null);
  }
  function byId(id) { for (var i = 0; i < listings.length; i++) if (listings[i].id === id) return listings[i]; return null; }
  async function patch(id, data) { try { await db.doc("listings/" + id).update(data); } catch (e) { infoModal(t("saveErr")); } }

  document.addEventListener("click", function (e) {
    if (e.target === modal) { closeModal(); return; }
    var el = e.target.closest("[data-act]");
    if (!el) return;
    var act = el.getAttribute("data-act"), id = el.getAttribute("data-id");
    if (act !== "del" && pendingDel) { pendingDel = null; if (act !== "delok") renderAll(); }
    switch (act) {
      case "unstage": chatState.pending.splice(Number(el.getAttribute("data-v")), 1); renderTray(); break;
      case "zoom": openModal('<img class="zoomimg" src="' + el.getAttribute("src") + '" alt="">'); break;
      case "share": shareListing(id); break;
      case "report": reportModal(id); break;
      case "about": aboutModal(); break;
      case "support": supportModal(); break;
      case "seller": sellerModal(id); break;
      case "terms": legalModal("terms", el.getAttribute("data-g") === "1"); break;
      case "privacy": legalModal("privacy", el.getAttribute("data-g") === "1"); break;
      case "star":
        F.rate = Number(el.getAttribute("data-v"));
        document.querySelectorAll("#starpick button").forEach(function (b, i) { b.textContent = i < F.rate ? "★" : "☆"; });
        break;
      case "revsend": sendReview(el.getAttribute("data-sid"), id); break;
      case "theme-light": case "theme-dark":
        var nt = act.slice(6);
        try { localStorage.setItem("ur_theme", nt); } catch (x) {}
        document.documentElement.setAttribute("data-theme", nt);
        renderAll(); break;
      case "lang-ru": case "lang-kk":
        lang = act === "lang-kk" ? "kk" : "ru";
        try { localStorage.setItem("ur_lang", lang); } catch (x) {}
        applyLang(); renderAll(); if (chatState.bot) { $("thread").firstChild && ($("thread").querySelector(".thead").outerHTML = botHead()); renderBot(false); } if (F.gateOn) gateModal(); break;
      case "cta": onCta(); break;
      case "market": F.market = el.getAttribute("data-v"); F.cat = "all"; renderChips(); renderNotice(); renderGrid(); break;
      case "fmode": listingModal(null, el.getAttribute("data-v")); break;
      case "fsub": listingModal(null, "farm", el.getAttribute("data-v")); break;
      case "cat": F.cat = el.getAttribute("data-v"); renderChips(); renderGrid(); break;
      case "mine": F.mine = !F.mine; renderChips(); renderGrid(); break;
      case "close": closeModal(); break;
      case "contact": var it = byId(id); if (!it) { for (var i = 0; i < DEMOS.length; i++) if (DEMOS[i].id === id) it = { example: true }; } if (it) contactModal(it); break;
      case "copy": copyPhone(el); break;
      case "login": gateModal(); break;
      case "google": googleLogin(); break;
      case "tab": setTab(el.getAttribute("data-v")); break;
      case "create": onCta(); break;
      case "heart": toggleFav(id); break;
      case "ptab": F.ptab = el.getAttribute("data-v"); renderProfile(); break;
      case "editprof": profileModal(); break;
      case "pickav": F.av = Number(el.getAttribute("data-v")); document.querySelectorAll(".avopt").forEach(function (b) { b.setAttribute("aria-checked", String(b === el)); }); break;
      case "logout": if (auth) { closeModal(); auth.signOut(); } break;
      case "inbox": setTab("chat"); break;
      case "chat": startChat(id); break;
      case "chat-open": if (chats[id]) selectChat(id, chats[id]); break;
      case "install": if (deferredInstall) { deferredInstall.prompt(); deferredInstall = null; renderProfile(); } break;
      case "bot-open": openBot(); break;
      case "bot-q": botAsk(Number(el.getAttribute("data-v"))); break;
      case "chat-back": leaveChat(); renderChatList(); break;
      case "edit": var o = byId(id); if (o) listingModal(o); break;
      case "sold": var rc = receivedDealChat(id); if (rc) dealStep("done", rc); else infoModal(t("soldNeedDeal")); break;
      case "deal-buy": dealStep("buy"); break;
      case "deal-sell": dealStep("sell"); break;
      case "deal-recv": dealStep("recv"); break;
      case "deal-done": dealStep("done"); break;
      case "deal-cancel": dealStep("cancel"); break;
      case "reopen": patch(id, { status: "active" }); break;
      case "del": pendingDel = id; renderAll(); break;
      case "delok": pendingDel = null; db.doc("listings/" + id).delete().catch(function () { infoModal(t("saveErr")); }); break;
    }
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !modal.hidden) closeModal(); });
  $("q").addEventListener("input", function (e) { F.q = e.target.value; renderGrid(); });
  $("regionSel").addEventListener("change", function (e) { F.region = e.target.value; renderGrid(); });
  $("sortSel").addEventListener("change", function (e) { F.sort = e.target.value; renderGrid(); });
  function boot() {
    applyLang(); renderAll();
    var cfg = window.FIREBASE_CONFIG;
    if (!window.firebase || !cfg || !cfg.apiKey || /PASTE/.test(cfg.apiKey)) { dbState = "off"; cfgMissing = true; renderAll(); gateDone = true; gateModal(); return; }
    try { firebase.initializeApp(cfg); db = firebase.firestore(); auth = firebase.auth(); } catch (e) { dbState = "error"; renderAll(); return; }
    dbState = "ok"; renderAll();
    db.collection("listings").orderBy("createdAt", "desc").limit(60).onSnapshot(function (snap) {
      listings = snap.docs.map(function (d) { var x = d.data() || {}; x.id = d.id; return x; });
      renderAll(); jumpToHash();
    }, function () { dbState = "error"; renderAll(); });
    auth.onAuthStateChanged(function (u) {
      if (sellersUnsub) { sellersUnsub(); sellersUnsub = null; }
      if (chatsUnsub) { chatsUnsub(); chatsUnsub = null; }
      if (favsUnsub) { favsUnsub(); favsUnsub = null; }
      if (reviewsUnsub) { reviewsUnsub(); reviewsUnsub = null; }
      reviews = [];
      if (!modal.hidden) closeModal();
      chatLeave();
      sellers = {}; chats = {}; favs = []; gateDone = false;
      uid = u ? u.uid : null; meName = (u && u.displayName) || ""; canWrite = !!u;
      if (uid) favs = loadLocalFavs();
      if (!u && F.tab !== "home") setTab("home");
      renderAll();
      if (!u) { decideGate(); return; }
      var sellerFilled = false;
      sellersUnsub = db.collection("sellers").limit(500).onSnapshot(function (snap) {
        var m = {}; snap.docs.forEach(function (d) { m[d.id] = d.data(); }); sellers = m; renderAll();
        if (sellers[u.uid] && !sellers[u.uid].createdAt && !sellerFilled) { sellerFilled = true; db.doc("sellers/" + u.uid).update({ createdAt: regTs() }).catch(function () {}); }
        decideGate();
      }, function () { decideGate(); });
      chatsUnsub = db.collection("chats").where("participants", "array-contains", u.uid).limit(200).onSnapshot(function (snap) {
        var m = {}; snap.docs.forEach(function (d) { var x = d.data() || {}; x.id = d.id; m[d.id] = x; });
        chats = m; renderTop();
        if (F.tab === "chat") {
          renderChatList();
          if (chatState.id) { markSeen(chatState.id); renderDeal(); renderMsgs(false); }
        }
      }, function () {});
      reviewsUnsub = db.collection("reviews").limit(1000).onSnapshot(function (snap) {
        reviews = snap.docs.map(function (d) { var x = d.data() || {}; x.id = d.id; return x; }); renderAll();
      }, function () {});
      favsUnsub = db.doc("favorites/" + u.uid).onSnapshot(function (snap) {
        if (!snap.exists) return;
        var d = snap.data() || {};
        if (Array.isArray(d.ids)) { favs = d.ids; saveLocalFavs(); renderAll(); }
      }, function () {});
    });
  }
  window.addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); deferredInstall = e; if (F.tab === "profile") renderProfile(); });
  window.addEventListener("appinstalled", function () { deferredInstall = null; if (F.tab === "profile") renderProfile(); });
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
  boot();
})();
</script>
